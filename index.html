<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CashPay Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#07090c;--card:#101720;--card2:#141c27;--line:#253142;--text:#f6f8fb;--muted:#8795a8;--green:#18c98d;--green2:#087e5d;--red:#ef5365;--amber:#f6bd4f;--blue:#6f8cff;--shadow:0 28px 80px rgba(0,0,0,.48);--r:24px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(24,201,141,.1),transparent 35%),var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}button,input{font:inherit;outline:none}button{cursor:pointer}.mono{font-family:'JetBrains Mono',monospace}#app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card,.modal,.balance,.assets,.txs{background:linear-gradient(145deg,rgba(20,29,40,.97),rgba(9,13,18,.97));border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);border-radius:var(--r)}.login-card{width:min(420px,100%);padding:34px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:23px;letter-spacing:-.03em}.logo{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#34e0a5,#087e5d);display:grid;place-items:center;box-shadow:0 10px 35px rgba(24,201,141,.25)}.logo svg{width:29px;height:29px}.login .brand{justify-content:center;margin-bottom:28px}.login h1{font-size:24px;margin:0 0 7px}.login p{font-size:13px;color:var(--muted);margin:0 0 25px}.field{margin-bottom:17px}.field label{display:block;font-size:11px;font-weight:800;color:#aab5c4;margin-bottom:8px}.field input{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#080c11;color:#fff}.field input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(24,201,141,.13)}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#20d699,#0aa675);color:#03140e;font-weight:800;box-shadow:0 12px 28px rgba(24,201,141,.2)}.error{display:none;background:rgba(239,83,101,.1);border:1px solid rgba(239,83,101,.3);color:#ff8794;padding:11px 13px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:16px}.error.show{display:block}.top{height:65px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(7,10,14,.82);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}.top-right{display:flex;align-items:center;gap:9px}.addr{display:flex;gap:7px;align-items:center;padding:6px 7px 6px 12px;border:1px solid var(--line);border-radius:30px;color:var(--muted);font-size:11px}.small-btn,.logout{border:1px solid var(--line);background:#111822;color:#dce4ee;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:800}.logout{border-radius:10px;background:transparent;color:var(--muted)}main{width:min(700px,100%);margin:auto;padding:34px 18px 60px}.balance{padding:30px;margin-bottom:17px;position:relative;overflow:hidden}.balance:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-170px;top:-190px;background:radial-gradient(circle,rgba(24,201,141,.17),transparent 68%);pointer-events:none}.profile{position:absolute;right:24px;top:24px;width:45px;height:45px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#dce5ef;display:grid;place-items:center;z-index:2}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#31dca5;font-weight:800}.total{font-size:49px;line-height:1;margin-top:12px;font-weight:800;letter-spacing:-.055em}.total sup{font-size:22px;opacity:.55}.alloc{height:9px;background:#1a222d;border-radius:20px;display:flex;overflow:hidden;margin:27px 0 14px}.seg{height:100%}.legend{display:flex;flex-wrap:wrap;gap:8px 16px;color:#8794a5;font-size:10px;font-weight:700}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}.action{padding:14px 8px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#131b26,#0d131b);color:#f4f7fa;font-weight:800;font-size:12px}.action.deposit{color:#2de0a2}.action.withdraw{color:#ffc85b}.action.tx{color:#91a6ff}.head{display:flex;justify-content:space-between;align-items:center;margin:0 3px 11px}.head h2{font-size:14px;margin:0}.head span{font-size:10px;color:#6f7d90;font-weight:700}.assets,.txs{overflow:hidden}.asset{display:grid;grid-template-columns:42px 1fr auto;gap:13px;align-items:center;padding:16px 17px;border-bottom:1px solid rgba(255,255,255,.055)}.asset:last-child,.tx:last-child{border-bottom:0}.coin{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:13px}.usdt{background:#26a17b}.usdc{background:#2775ca}.sol{background:linear-gradient(135deg,#00ffa3,#9945ff)}.bnb{background:#f3ba2f}.eth{background:#627eea}.trx{background:#ef233c}.pol{background:#8247e5}.avax{background:#e84142}.btc{background:#f7931a}.asset-name{font-size:13px;font-weight:800}.asset-sub{font-size:10px;color:#7f8c9d;margin-top:4px}.asset-value{text-align:right;font-size:13px;font-weight:800}.change{font-size:10px;margin-top:3px;color:#28d69d}.section-gap{margin-top:29px}.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.055)}.tx-icon{width:40px;height:40px;border-radius:12px;background:#171f2a;border:1px solid var(--line);display:grid;place-items:center;font-size:18px}.tx-title{font-size:12px;font-weight:800}.tx-sub,.tx-date{font-size:9px;color:#738196;margin-top:4px}.tx-right{text-align:right;font-size:12px;font-weight:800}.positive{color:#2ddca2}.negative{color:#ffc457}.status{font-size:8px;color:#2ddca2;margin-top:4px}.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);backdrop-filter:blur(9px);display:grid;place-items:center;padding:18px}.modal{width:min(455px,100%);max-height:90vh;overflow:auto;padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{font-size:18px;margin:0}.close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#0b1016;color:#9aa8b9;font-size:20px}.network-list,.token-list{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.pill{padding:9px 11px;border-radius:20px;border:1px solid var(--line);background:#0b1118;color:#8c99aa;font-size:10px;font-weight:800}.pill.active{border-color:var(--green);background:rgba(24,201,141,.08);color:#fff}.qr-wrap{background:#fff;width:205px;height:205px;padding:15px;border-radius:18px;margin:10px auto 18px;display:grid;place-items:center}.qr-wrap #qrcode{width:175px;height:175px;display:grid;place-items:center}.address{background:#080d12;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center;word-break:break-all;font-size:11px;line-height:1.5;margin-bottom:13px}.copy{margin-bottom:3px}.input{width:100%;background:#080d12;color:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12px;margin-bottom:13px}.fee{display:flex;justify-content:space-between;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#0b1118;color:#8d9aaa;font-size:11px;margin:4px 0 18px}.fee strong{color:#fff}.profile-hero{display:flex;gap:13px;align-items:center;margin-bottom:20px}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#20d699,#087e5d);display:grid;place-items:center;color:#03140e;font-weight:900}.profile-name{font-size:18px;font-weight:800}.verified{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:15px;background:rgba(24,201,141,.08);border:1px solid rgba(24,201,141,.2);color:#2edca3;font-size:9px;font-weight:800}.detail{display:flex;justify-content:space-between;gap:15px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-top:8px;font-size:10px}.detail span:first-child{color:#7e8b9e}.detail span:last-child{font-weight:800;text-align:right}.notice{padding:11px 12px;margin-top:15px;border:1px solid rgba(24,201,141,.15);background:rgba(24,201,141,.05);border-radius:11px;color:#8edbc4;font-size:10px;font-weight:700}@media(max-width:600px){.top{padding:0 14px}.top .addr{display:none}main{padding:21px 12px 45px}.balance{padding:24px 20px}.total{font-size:40px}.actions{gap:7px}.action{font-size:11px}.asset{grid-template-columns:38px 1fr auto;padding:14px 12px}.coin{width:38px;height:38px}.asset-name{font-size:12px}.modal{padding:21px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ADDRESSES={Ethereum:'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939',Base:'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939',Tron:'TY6raJrBbuopXQB9PvjxUtGrtWbiZupA21',Solana:'FSm6VJPV5nH8vvvFRUjXzHzc259Y3wuqc6cJPxguXin8','BNB Chain':'0xbcafc75cf2157c810cbeb7dcacd4f9635f9fb939'};
const TOKENS=[
 {symbol:'USDT',name:'Tether USD',chain:'Ethereum',amount:13000,price:1,cls:'usdt',change:0.12},
 {symbol:'USDC',name:'USD Coin',chain:'Base',amount:12000,price:1,cls:'usdc',change:0.08},
 {symbol:'SOL',name:'Solana',chain:'Solana',amount:65,price:182.5,cls:'sol',change:5.84},
 {symbol:'BNB',name:'BNB',chain:'BNB Chain',amount:7,price:580,cls:'bnb',change:0.85},
 {symbol:'ETH',name:'Ethereum',chain:'Ethereum',amount:.00042,price:3450,cls:'eth',change:2.15},
 {symbol:'TRX',name:'TRON Native',chain:'Tron',amount:12.5,price:.16,cls:'trx',change:1.2},
 {symbol:'POL',name:'Polygon',chain:'Polygon',amount:.177,price:.45,cls:'pol',change:-.45},
 {symbol:'AVAX',name:'Avalanche',chain:'Avalanche',amount:.00048,price:42,cls:'avax',change:3.1},
 {symbol:'BTC',name:'Bitcoin',chain:'Bitcoin',amount:.00000005,price:95000,cls:'btc',change:1.12}
];
const FEE=10;
const PROFILE={name:'William Olamide',email:'william.olamide@example.com',phone:'+234 801 234 5678',country:'Nigeria',accountId:'CP-2048-7812',kyc:'Verified',status:'Active'};
const TX=[
 ['deposit','USDT Deposit','Ethereum · Tether USD','+1,000.00 USDT','Aug 20, 2026 · 14:32'],
 ['withdraw','USDC Withdrawal','Base · USD Coin','−250.00 USDC','Aug 19, 2026 · 10:18'],
 ['withdraw','SOL Withdrawal','Solana · 0.750000 SOL','−136.88 USD','Aug 18, 2026 · 18:47'],
 ['deposit','USDC Deposit','Base · USD Coin','+500.00 USDC','Aug 16, 2026 · 09:05']
];
const state={logged:false,modal:null,network:'Ethereum',token:'USDT',profile:false};
const money=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const total=()=>TOKENS.reduce((s,t)=>s+t.amount*t.price,0);
const short=a=>a.slice(0,7)+'...'+a.slice(-5);
function coin(t){return `<div class="coin ${t.cls}">${t.symbol==='USDT'?'₮':t.symbol==='USDC'?'◉':t.symbol}</div>`}
function login(){app.innerHTML=`<div class="login"><div><div class="brand"><div class="logo">${logo()}</div><span>CashPay</span></div><div class="login-card"><h1>Sign In</h1><p>Access your multi-chain crypto balances</p><div id="err" class="error"></div><form id="form"><div class="field"><label>Email address</label><input id="email" type="email" placeholder="name@example.com" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div><button class="primary">Sign In to Dashboard</button></form></div></div></div>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();let em=email.value.trim().toLowerCase(),pw=password.value;if(em==='williamolamide43@gmail.com'&&pw==='mide36482'){state.logged=true;render()}else{err.textContent=(!em||!pw)?'Email and password are required.':'Invalid email or password.';err.classList.add('show')}}}
function logo(){return `<svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="13" fill="#eafff7"/><path d="M31.7 13.7c-2.1-2-4.9-3.2-8.1-3.2-6.5 0-11.7 5.2-11.7 11.7s5.2 11.7 11.7 11.7c3.2 0 6-1.2 8.1-3.2" fill="none" stroke="#087e5d" stroke-width="4.2" stroke-linecap="round"/><path d="M13.8 22.2h13.4c2.4 0 4.4 1.9 4.4 4.3v1.2H18.2c-2.4 0-4.4-1.9-4.4-4.3v-1.2Z" fill="#087e5d"/></svg>`}
function dashboard(){let sum=total(),segs=TOKENS.map(t=>`<div class="seg" style="width:${(t.amount*t.price/sum)*100}%;background:${t.symbol==='USDT'?'#26a17b':t.symbol==='USDC'?'#2775ca':t.symbol==='SOL'?'#9945ff':t.symbol==='BNB'?'#f3ba2f':'#627eea'}"></div>`).join('');let assets=TOKENS.map(t=>`<div class="asset">${coin(t)}<div><div class="asset-name">${t.name} <span style="color:#718095;font-weight:500">(${t.symbol})</span></div><div class="asset-sub">${t.amount} ${t.symbol} · <span class="mono">${t.chain}</span></div></div><div class="asset-value">$${money(t.amount*t.price)}<div class="change">${t.change>=0?'+':''}${t.change.toFixed(2)}%</div></div></div>`).join('');let tx=TX.map(x=>`<div class="tx"><div class="tx-icon">${x[0]==='deposit'?'↓':'↑'}</div><div><div class="tx-title">${x[1]}</div><div class="tx-sub">${x[2]}</div></div><div class="tx-right ${x[0]==='deposit'?'positive':'negative'}">${x[3]}<div class="status">Completed</div><div class="tx-date">${x[4]}</div></div></div>`).join('');app.innerHTML=`<header class="top"><div class="brand"><div class="logo" style="width:32px;height:32px;border-radius:10px">${logo()}</div><span style="font-size:17px">CashPay</span></div><div class="top-right"><div class="addr"><span class="mono">${short(ADDRESSES.Ethereum)}</span><button class="small-btn" id="copyTop">Copy</button></div><button class="logout" id="logout">Logout</button></div></header><main><section class="balance"><button class="profile" id="profile" aria-label="Profile">◯</button><div class="eyebrow">Total Portfolio Balance</div><div class="total">$${money(sum).split('.')[0]}<sup>.${money(sum).split('.')[1]}</sup></div><div class="alloc">${segs}</div><div class="legend"><span><i class="dot" style="background:#26a17b"></i>USDT</span><span><i class="dot" style="background:#2775ca"></i>USDC</span><span><i class="dot" style="background:#9945ff"></i>SOL</span><span><i class="dot" style="background:#f3ba2f"></i>BNB</span><span><i class="dot" style="background:#627eea"></i>Other assets</span></div></section><div class="actions"><button class="action deposit" id="deposit">↓ Deposit</button><button class="action withdraw" id="withdraw">↑ Withdraw</button><button class="action tx" id="transactions">☷ Transactions</button></div><div class="head"><h2>Your Assets</h2><span>${TOKENS.length} Assets</span></div><section class="assets">${assets}</section><div class="head section-gap"><h2>Transaction History</h2><span>${TX.length} Recent</span></div><section class="txs">${tx}</section></main>${state.modal?modal():''}${state.profile?profileModal():''}`;handlers()}
function modal(){if(state.modal==='receive'){let nets=Object.keys(ADDRESSES);return `<div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><h3>Deposit Funds</h3><button class="close" id="close">×</button></div><div style="font-size:11px;color:#8996a8;font-weight:800;margin-bottom:8px">SELECT NETWORK</div><div class="network-list">${nets.map(n=>`<button class="pill ${n===state.network?'active':''}" data-net="${n}">${n}</button>`).join('')}</div><div class="qr-wrap"><div id="qrcode"></div></div><div class="address mono" id="receiveAddress">${ADDRESSES[state.network]}</div><button class="primary copy" id="copyAddress">Copy Deposit Address</button></div></div>`}let t=TOKENS.find(x=>x.symbol===state.token)||TOKENS[0];return `<div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><h3>Withdraw Crypto</h3><button class="close" id="close">×</button></div><div class="token-list">${TOKENS.map(x=>`<button class="pill ${x.symbol===state.token?'active':''}" data-token="${x.symbol}">${x.symbol} · ${x.chain}</button>`).join('')}</div><label style="font-size:10px;color:#8996a8;font-weight:800">DESTINATION ADDRESS</label><input class="input" placeholder="Paste ${t.chain} address"><label style="font-size:10px;color:#8996a8;font-weight:800">AMOUNT</label><input class="input" type="number" placeholder="0.00"><div style="font-size:10px;color:#77869a;margin:-5px 0 14px">Available: ${t.amount} ${t.symbol}</div><div class="fee"><span>Network Fee</span><strong>$${FEE.toFixed(2)}</strong></div><button class="primary" id="confirm">Confirm Withdrawal</button></div></div>`}
function profileModal(){return `<div class="overlay" id="profileOverlay"><div class="modal"><div class="modal-head"><h3>Profile</h3><button class="close" id="closeProfile">×</button></div><div class="profile-hero"><div class="avatar">WO</div><div><div class="profile-name">${PROFILE.name}</div><div style="font-size:10px;color:#8795a8;margin-top:4px">${PROFILE.email}</div><span class="verified">✓ KYC Verified</span></div></div>${[['Full name',PROFILE.name],['Phone',PROFILE.phone],['Country',PROFILE.country],['Account ID',PROFILE.accountId],['KYC status',PROFILE.kyc],['Account status',PROFILE.status]].map(d=>`<div class="detail"><span>${d[0]}</span><span>${d[1]}</span></div>`).join('')}<div class="notice">✓ Account security active · 2FA enabled</div></div></div>`}
function handlers(){document.getElementById('logout')?.addEventListener('click',()=>{state.logged=false;render()});document.getElementById('profile')?.addEventListener('click',()=>{state.profile=true;render()});document.getElementById('closeProfile')?.addEventListener('click',()=>{state.profile=false;render()});document.getElementById('profileOverlay')?.addEventListener('click',e=>{if(e.target.id==='profileOverlay'){state.profile=false;render()}});document.getElementById('copyTop')?.addEventListener('click',()=>copy(ADDRESSES.Ethereum));document.getElementById('deposit')?.addEventListener('click',()=>{state.modal='receive';render()});document.getElementById('withdraw')?.addEventListener('click',()=>{state.modal='withdraw';render()});document.getElementById('transactions')?.addEventListener('click',()=>document.querySelector('.txs')?.scrollIntoView({behavior:'smooth'}));document.getElementById('close')?.addEventListener('click',()=>{state.modal=null;render()});if(state.modal==='receive'){document.querySelectorAll('[data-net]').forEach(b=>b.onclick=()=>{state.network=b.dataset.net;render()});document.getElementById('copyAddress')?.addEventListener('click',()=>copy(ADDRESSES[state.network]));makeQR(ADDRESSES[state.network])}if(state.modal==='withdraw'){document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{state.token=b.dataset.token;render()});document.getElementById('confirm')?.addEventListener('click',()=>alert('Withdrawal request created. Network fee: $10.00'))}}
function makeQR(text){let box=document.getElementById('qrcode');if(!box)return;box.innerHTML='';if(window.QRCode){new QRCode(box,{text,width:175,height:175,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}}
function copy(text){navigator.clipboard?.writeText(text).then(()=>alert('Copied to clipboard')).catch(()=>alert(text))}
function render(){state.logged?dashboard():login()}
render();
</script>
</body>
</html>
