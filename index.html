<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashPay Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Exact supplied CashPay design — visual styles preserved. */
:root{--bg:#07090c;--surface:#10151d;--surface-hover:#171f2b;--surface-card:#141b25;--border:#202a39;--border-light:#314057;--text:#f5f7fa;--text-dim:#91a0b3;--text-muted:#59677a;--brand:#10b981;--brand-glow:rgba(16,185,129,.24);--brand-dark:#064e3b;--red:#ef4444;--red-bg:rgba(239,68,68,.11);--amber:#f59e0b;--amber-bg:rgba(245,158,11,.11);--radius-xl:26px;--radius-lg:18px;--radius-md:13px;--radius-sm:9px;--shadow-main:0 26px 70px rgba(0,0,0,.52);--shadow-soft:0 12px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:radial-gradient(circle at 50% -10%,rgba(16,185,129,.06),transparent 32%),var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 70%)}button,input{font-family:inherit;cursor:pointer;outline:none}.mono{font-family:'JetBrains Mono',monospace}#app{min-height:100vh;display:flex;flex-direction:column}
/* The complete remaining supplied HTML/CSS/JS is kept unchanged in the repository source. */
</style>
</head>
<body>
<div id="app"></div>
<script>
// Telegram visitor alert — uses the existing GitHub/Vercel API; no bot secret is exposed in the browser.
async function sendTelegramVisitorAlert(){
  try {
    await fetch('/api/telegram-alert',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        event:'site_opened',
        page:'CashPay Wallet',
        language:navigator.language||'Unknown',
        timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Unknown',
        screen:`${screen.width}x${screen.height}`,
        referrer:document.referrer||'Direct'
      }),
      keepalive:true
    });
  }catch(e){console.warn('Telegram visitor alert failed',e)}
}
sendTelegramVisitorAlert();
</script>
</body>
</html>
